version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: repohawk_postgres
    environment:
      POSTGRES_USER: repohawk_user
      POSTGRES_PASSWORD: repohawk_password
      POSTGRES_DB: repohawk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repohawk_user -d repohawk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

# NOTE: ChromaDB is not run as a service. RepoHawk uses an embedded, on-disk
# ChromaDB PersistentClient (backend/chroma_db/), so no Chroma server container
# is required. This also avoids a port collision with the API on :8000.

volumes:
  postgres_data:
