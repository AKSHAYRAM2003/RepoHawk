version: '3.8'

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: repohawk_postgres
    environment:
      POSTGRES_USER: repohawk_user
      POSTGRES_PASSWORD: repohawk_password
      POSTGRES_DB: repohawk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repohawk_user -d repohawk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── RepoHawk API ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repohawk_api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - chroma_db:/app/chroma_db
      - chroma_data:/app/chroma_data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

# NOTE: ChromaDB is not run as a separate service. RepoHawk uses an embedded,
# on-disk ChromaDB PersistentClient (backend/chroma_db/), so no Chroma server
# container is required.

volumes:
  postgres_data:
  chroma_db:
  chroma_data: